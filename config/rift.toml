# Rift tiling WM. Linked to ~/.config/rift/config.toml by home.nix; reloads on save.
# Full reference: /opt/homebrew/share/rift/rift.default.toml
#
# Keys are matched by keycode, so letters follow the active kanata layer
# (Gallium letters in English, QWERTY positions in other languages).

[settings]
animate = false
default_disable = false # tile every space without toggling it on first
focus_follows_mouse = false
mouse_follows_focus = true
mouse_hides_on_focus = false
auto_focus_blacklist = ["com.raycast.macos", "com.apple.Spotlight"]
run_on_start = []
hot_reload = true

[settings.layout]
mode = "traditional"
window_insertion_point = "next_to_selection"

[settings.layout.traditional]
equalize_nodes = true

[settings.layout.master_stack]
master_ratio = 0.6
master_count = 1
master_side = "left"
new_window_placement = "stack"

[settings.layout.scrolling]
column_width_ratio = 0.7
alignment = "center"
focus_navigation_style = "niri"

[settings.layout.stack]
stack_offset = 40.0
default_orientation = "perpendicular"

[settings.layout.gaps.outer]
top = 8
left = 8
bottom = 8
right = 8

[settings.layout.gaps.inner]
horizontal = 8
vertical = 8

[settings.ui.menu_bar]
enabled = true
show_empty = false
display_style = "label"
active_label = "index"

[settings.ui.stack_line]
enabled = true

[settings.gestures]
enabled = false

# Hold Fn and drag anywhere in a window to move it.
[settings.drag_drop]
enabled = true
modifier = "fn"
drop_action = "swap"

[virtual_workspaces]
mode = "per_display"
enabled = true
default_workspace_count = 9
auto_assign_windows = true
preserve_focus_per_workspace = true
workspace_auto_back_and_forth = false
workspace_names = []

app_rules = [
  { app_id = "com.apple.systempreferences", floating = true },
  { app_id = "com.apple.ActivityMonitor", floating = true },
  { app_id = "com.apple.calculator", floating = true },
  { app_id = "com.apple.archiveutility", floating = true },
  { app_id = "com.bitwarden.desktop", floating = true },
  { app_id = "net.imput.helium", title_regex = "^Bitwarden$", floating = true }, # extension pop-out
  { app_id = "com.maxgoedjen.Secretive.Host", floating = true },
  { app_id = "com.objective-see.lulu.app", floating = true },
  { app_id = "net.mullvad.vpn", floating = true },
  { app_id = "com.raycast.macos", manage = false },
  { title_substring = "Settings", floating = true },
  { title_substring = "Preferences", floating = true },
  { ax_subrole = "AXDialog", floating = true },
]

[modifier_combinations]
move = "Alt + Shift"

[keys]
"Alt + Z" = "toggle_space_activated"
"Alt + Shift + R" = "reload_config"

# Focus / move
"Alt + H" = { move_focus = "left" }
"Alt + J" = { move_focus = "down" }
"Alt + K" = { move_focus = "up" }
"Alt + L" = { move_focus = "right" }
"move + H" = { move_node = "left" }
"move + J" = { move_node = "down" }
"move + K" = { move_node = "up" }
"move + L" = { move_node = "right" }

# Join into a container in that direction
"Alt + Ctrl + H" = { join_window = "left" }
"Alt + Ctrl + J" = { join_window = "down" }
"Alt + Ctrl + K" = { join_window = "up" }
"Alt + Ctrl + L" = { join_window = "right" }
"Alt + Ctrl + U" = "unjoin_windows"

# Workspaces 1-9
"Alt + 1" = { switch_to_workspace = 0 }
"Alt + 2" = { switch_to_workspace = 1 }
"Alt + 3" = { switch_to_workspace = 2 }
"Alt + 4" = { switch_to_workspace = 3 }
"Alt + 5" = { switch_to_workspace = 4 }
"Alt + 6" = { switch_to_workspace = 5 }
"Alt + 7" = { switch_to_workspace = 6 }
"Alt + 8" = { switch_to_workspace = 7 }
"Alt + 9" = { switch_to_workspace = 8 }
"move + 1" = { move_window_to_workspace = 0 }
"move + 2" = { move_window_to_workspace = 1 }
"move + 3" = { move_window_to_workspace = 2 }
"move + 4" = { move_window_to_workspace = 3 }
"move + 5" = { move_window_to_workspace = 4 }
"move + 6" = { move_window_to_workspace = 5 }
"move + 7" = { move_window_to_workspace = 6 }
"move + 8" = { move_window_to_workspace = 7 }
"move + 9" = { move_window_to_workspace = 8 }
"Alt + Tab" = "switch_to_last_workspace"

# Layout of the current workspace
"Alt + Ctrl + 1" = { set_workspace_layout = { mode = "traditional" } }
"Alt + Ctrl + 2" = { set_workspace_layout = { mode = "bsp" } }
"Alt + Ctrl + 3" = { set_workspace_layout = { mode = "master_stack" } }
"Alt + Ctrl + 4" = { set_workspace_layout = { mode = "scrolling" } }

# Containers
"Alt + Comma" = "toggle_stack"
"Alt + Slash" = "toggle_orientation"
"Alt + Equal" = "balance"

# Floating / fullscreen
"Alt + Shift + Space" = { toggle_window_floating = { center = true } }
"Alt + Space" = "toggle_focus_floating"
"Alt + F" = "toggle_fullscreen_within_gaps"
"Alt + Shift + F" = "toggle_fullscreen"

# Resize
"Alt + R" = { binding_mode = "resize" }
"Alt + Shift + Equal" = { resize_window_grow = "smart" }
"Alt + Shift + Minus" = { resize_window_shrink = "smart" }

# Displays
"Alt + Period" = { focus_display = "right" }
"move + Period" = { move_window_to_display = { selector = "right" } }

"Alt + Enter" = { exec = ["open", "-na", "Ghostty"] }

# Keep [keys] above this line: TOML headers scope everything after them.
[binding_modes.resize]
"H" = { resize_window_shrink = "horizontal" }
"L" = { resize_window_grow = "horizontal" }
"J" = { resize_window_grow = "vertical" }
"K" = { resize_window_shrink = "vertical" }
"Equal" = "balance"
"Escape" = { binding_mode = "default" }
"Enter" = { binding_mode = "default" }
