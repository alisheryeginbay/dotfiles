#:schema https://github.com/joshmedeski/sesh/raw/main/sesh.schema.json

blacklist = ["scratch"]

[[session]]
name = "nix"
path = "/etc/nix-darwin"

# Window 1: nvim. Window 2: the Astro dev server.
[[session]]
name = "website"
path = "~/Developer/yeginbay.com"
startup_command = "nvim"
windows = ["dev"]

[[window]]
name = "dev"
startup_script = "bun run dev"

[[session]]
name = "flashcards"
path = "~/flashcards"
startup_command = "nvim ."
