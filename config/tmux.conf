# Prefix, base index, mouse, terminal, escape time and history are set by
# programs.tmux in home.nix; plugins are loaded there too, after this file.

set -g renumber-windows on

bind r source-file ~/.config/tmux/tmux.conf \; display "✅ Reloaded"

# Splits: - stacks, | side by side; new panes open in the current dir
unbind '"'
unbind %
bind - split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"

# sesh: fuzzy-pick a tmux session, zoxide dir or config entry
bind T display-popup -E -w 80% -h 70% "sesh picker --icons --hide-duplicates"
bind L run-shell "sesh last"
# Killing a session switches to another instead of detaching
set -g detach-on-destroy off

set -as terminal-features ",xterm-ghostty:RGB"
# Claude Code falls back to 256 colors inside tmux unless told truecolor works
set-environment -g CLAUDE_CODE_TMUX_TRUECOLOR 1

# Modus: status bar styled like the Emacs mode line, using the same
# palette values (bg/fg/border-mode-line-* and bg-region) as Emacs.
# The hooks fire when Ghostty flips Vivendi (dark) / Operandi (light).
set-hook -g client-dark-theme {
  set -g status-style "bg=#505050,fg=#ffffff"
  setw -g window-status-style "fg=#969696"
  set -g pane-border-style "fg=#606060"
  set -g pane-active-border-style "fg=#959595"
  setw -g mode-style "bg=#5a5a5a,fg=#ffffff"
}
set-hook -g client-light-theme {
  set -g status-style "bg=#c8c8c8,fg=#000000"
  setw -g window-status-style "fg=#585858"
  set -g pane-border-style "fg=#a3a3a3"
  set -g pane-active-border-style "fg=#5a5a5a"
  setw -g mode-style "bg=#bdbdbd,fg=#000000"
}
# tmux can't ask the terminal for its current theme, so pick the
# starting colors from the macOS appearance (the same check Emacs uses).
if "defaults read -g AppleInterfaceStyle" \
  "set-hook -gR client-dark-theme" "set-hook -gR client-light-theme"

# Mode line layout: bold buffer (session) name, plain info on the right
setw -g window-status-current-style "fg=default,bold"
setw -g window-status-activity-style "underscore"
setw -g window-status-separator "  "
set -g status-left "  #[bold]#S#[nobold]    "
set -g status-left-length 30
set -g status-right "%Y-%m-%d  %H:%M  "

# Command prompt / messages look like the echo area: plain, no bar
set -g message-style "bg=default,fg=default"
set -g message-command-style "bg=default,fg=default"
