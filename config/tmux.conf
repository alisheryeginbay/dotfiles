unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g base-index 1
set -g pane-base-index 1

set -g mouse on
set -g renumber-windows on

bind r source-file ~/.tmux.conf \; display "✅ Reloaded"

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"

# gruvbox-material (dark medium)
set -g status-style "bg=#282828,fg=#d4be98"

# windows
setw -g window-status-style "bg=#282828,fg=#928374"
setw -g window-status-current-style "bg=#45403d,fg=#d8a657,bold"
setw -g window-status-activity-style "fg=#e78a4e"

# panes
set -g pane-border-style "fg=#45403d"
set -g pane-active-border-style "fg=#a9b665"

# messages / command prompt
set -g message-style "bg=#45403d,fg=#d4be98"

# left + right status
set -g status-left "#[bg=#a9b665,fg=#282828,bold] #S #[default] "
set -g status-right "#[fg=#7daea3]%Y-%m-%d #[fg=#d8a657]%H:%M "

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'

# set -g @continuum-restore 'on'

run '~/.tmux/plugins/tpm/tpm'

