unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g base-index 1
set -g pane-base-index 1

set -g mouse on
set -g renumber-windows on

bind r source-file ~/.tmux.conf \; display "✅ Reloaded"

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"

# Modus: use the terminal's ANSI palette so it follows Ghostty's
# Modus Vivendi (dark) / Modus Operandi (light) switch.
set -g status-style "bg=default,fg=default"

# windows
setw -g window-status-style "fg=brightblack"
setw -g window-status-current-style "fg=blue,bold"
setw -g window-status-activity-style "fg=magenta"

# panes
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=blue"

# messages / command prompt
set -g message-style "fg=blue,bold"

# left + right status
set -g status-left "#[fg=blue,bold,reverse] #S #[default] "
set -g status-right "#[fg=cyan]%Y-%m-%d #[fg=blue]%H:%M "

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'

# set -g @continuum-restore 'on'

run '~/.tmux/plugins/tpm/tpm'

